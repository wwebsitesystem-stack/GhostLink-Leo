<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostLink - Shut Down</title>
    <meta name="description" content="This website was shut down by Nexus Official.">
    <style>
        :root {
            --bg: #000000;
            --accent: #6ecbff;
            --accent-glow: rgba(110, 203, 255, 0.3);
            --text-primary: #ffffff;
            --text-dim: #94a3b8;
            --border: rgba(110, 203, 255, 0.12);
            --card-bg: rgba(255, 255, 255, 0.03);
            --font: 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-block;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 0.68rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 4px;
            margin-bottom: 28px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 2.3rem);
            line-height: 1.25;
            margin-bottom: 22px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        h1 span { color: var(--accent); }

        p {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.8;
            margin-bottom: 18px;
        }

        .email {
            display: inline-block;
            margin-top: 12px;
            color: var(--accent);
            font-size: 1rem;
            text-decoration: none;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 2px;
            word-break: break-all;
            transition: 0.2s;
        }

        .email:hover {
            text-shadow: 0 0 12px var(--accent-glow);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .footer {
            margin-top: 36px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge">Offline</div>
        <h1>This website was <span>shut down</span> by Nexus Official.</h1>
        <p>If you believe we made a mistake, email us and we will take a look.</p>
        <a class="email" href="mailto:web.solutions@textnexus.me">web.solutions@textnexus.me</a>
        <div class="footer">Nexus Official</div>
    </main>
</body>
</html>
